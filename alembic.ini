# Alembic config skeleton (spec 12.2; first revision belongs to D3/RV-04/RV-05).
# Database URL is NOT read from this file: alembic/env.py injects it from the
# AGENT_DATABASE_URL env var (spec 15.2). This file keeps a placeholder only,
# so configparser never fails on local locale encodings (ASCII comments only).
[alembic]
script_location = alembic
prepend_sys_path = src
# sqlalchemy.url is injected from AGENT_DATABASE_URL by alembic/env.py; leave empty.
sqlalchemy.url =

# Logging (env.py may override as needed)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
